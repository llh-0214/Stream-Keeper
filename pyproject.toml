[project]
name = "stream-keeper"
version = "0.2.6"
description = "抖音、小红书、哔哩哔哩和通用直播流自动录制桌面工具"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Stream Keeper contributors" }]
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "httpx[http2]>=0.28.1",
  "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "pyinstaller>=6.11",
]

[project.scripts]
stream-keeper = "live_recorder.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["live_recorder"]
